plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def pushEnabled = (project.findProperty('dart-defines') ?: '').split(',').any {
    new String(it.decodeBase64(), 'UTF-8') == 'PUSH_ENABLED=true'
}
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else if (pushEnabled) {
    throw new GradleException('PUSH_ENABLED requires android/app/google-services.json from your Firebase project')
}

android {
    namespace = "ru.itscenter.its_avito"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "ru.itscenter.its_avito"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Distribution signing is intentionally not configured yet.
            // Debug APKs are for internal testing only.
        }
    }
}

flutter {
    source = "../.."
}
