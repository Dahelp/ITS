name: Deploy to Beget

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'mobile/**'
      - '.github/workflows/avito-mobile.yml'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify protection and SSH without publishing files
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: its-center-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require current master before accessing server credentials
        run: node .github/scripts/require-current-master.cjs

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/beget_deploy_key
          chmod 600 ~/.ssh/beget_deploy_key
          ssh-keygen -y -f ~/.ssh/beget_deploy_key > /dev/null
          cp .github/production-known-hosts ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  ConnectTimeout 25\n  StrictHostKeyChecking yes\n  IPQoS none\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts

      - name: Check SSH connection
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key \
            -p "${{ secrets.BEGET_PORT }}" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" \
            "test -d '${{ secrets.BEGET_PATH }}' && printf 'Beget SSH read-only check OK\n'"

      - name: Deploy files
        if: inputs.verify_only != true
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          rsync -rlgoDzvc --delete \
            -e "ssh -i ~/.ssh/beget_deploy_key -p ${{ secrets.BEGET_PORT }}" \
            --include='vendor/' \
            --include='vendor/ishop/' \
            --include='vendor/ishop/core/***' \
            --exclude='vendor/***' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='mobile/' \
            --exclude='.gitignore' \
            --exclude='.git.corrupt-*' \
            --exclude='.idea/' \
            --exclude='archive/' \
            --exclude='tmp/' \
            --exclude='storage/' \
            --include='public/cron/' \
            --include='public/cron/run_task_cli.php' \
            --exclude='public/cron/***' \
            --exclude='public/xls/' \
            --exclude='public/xml/' \
            --exclude='public/storage/' \
            --exclude='public/uploads/' \
            --filter='protect app/services/HomeCatalog.php' \
            --filter='protect public/css/home.css' \
            --filter='protect public/js/home.js' \
            --filter='protect public/images/home/***' \
            --filter='protect public/images/category/***' \
            --filter='protect public/images/contents/baseimg/***' \
            --filter='protect public/images/complete/baseimg/***' \
            --filter='protect public/images/complete/mini/***' \
            --filter='protect public/images/complete/gallery/***' \
            --filter='protect public/images/contents/mini/***' \
            --filter='protect public/images/contents/tmp/***' \
            --filter='protect public/images/product/original/***' \
            --filter='protect public/images/product/baseimg/***' \
            --filter='protect public/images/product/mini/***' \
            --filter='protect public/images/product/gallery/***' \
            --filter='protect public/images/product/tmp/***' \
            --filter='protect public/images/product/unload/***' \
            --exclude='config/api.php' \
            --exclude='config/config_db.php' \
            --exclude='config/config_db_tamozh.php' \
            --exclude='config/params.php' \
            ./ "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:${{ secrets.BEGET_PATH }}/"

      - name: Install Composer dependencies
        if: inputs.verify_only != true
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key \
            -p "${{ secrets.BEGET_PORT }}" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" \
            "cd '${{ secrets.BEGET_PATH }}' && composer-php7.4 install --no-dev --no-interaction --optimize-autoloader"

      - name: Install product certificates
        if: inputs.verify_only != true
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd '${{ secrets.BEGET_PATH }}' && (php8.2 scripts/install_certificates.php || php8.1 scripts/install_certificates.php || php7.4 scripts/install_certificates.php || php scripts/install_certificates.php) && (php8.2 scripts/seed_ekka_certificate.php || php8.1 scripts/seed_ekka_certificate.php || php7.4 scripts/seed_ekka_certificate.php || php scripts/seed_ekka_certificate.php)"

      - name: Install order traffic source
        if: inputs.verify_only != true
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd '${{ secrets.BEGET_PATH }}' && (php8.2 scripts/add_order_traffic_source.php || php8.1 scripts/add_order_traffic_source.php || php7.4 scripts/add_order_traffic_source.php || php scripts/add_order_traffic_source.php)"

      - name: Install unified cross references
        if: inputs.verify_only != true
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd '${{ secrets.BEGET_PATH }}' && (php8.2 scripts/install_unified_crosses.php || php8.1 scripts/install_unified_crosses.php || php7.4 scripts/install_unified_crosses.php || php scripts/install_unified_crosses.php)"

      - name: Seed wheel cross metadata
        if: inputs.verify_only != true
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd '${{ secrets.BEGET_PATH }}' && (php8.2 scripts/seed_wheel_cross_metadata.php || php8.1 scripts/seed_wheel_cross_metadata.php || php7.4 scripts/seed_wheel_cross_metadata.php || php scripts/seed_wheel_cross_metadata.php)"

      - name: Add article content
        if: inputs.verify_only != true
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key \
            -p "${{ secrets.BEGET_PORT }}" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" \
            "cd '${{ secrets.BEGET_PATH }}' && (php8.2 scripts/add_content_image_source.php || php8.1 scripts/add_content_image_source.php || php7.4 scripts/add_content_image_source.php || php scripts/add_content_image_source.php) && (php8.2 scripts/add_tire_wear_article.php || php8.1 scripts/add_tire_wear_article.php || php7.4 scripts/add_tire_wear_article.php || php scripts/add_tire_wear_article.php) && (php8.2 scripts/add_tire_pressure_monitoring_article.php || php8.1 scripts/add_tire_pressure_monitoring_article.php || php7.4 scripts/add_tire_pressure_monitoring_article.php || php scripts/add_tire_pressure_monitoring_article.php) && (php8.2 scripts/apply_seo_strong_tz.php || php8.1 scripts/apply_seo_strong_tz.php || php7.4 scripts/apply_seo_strong_tz.php || php scripts/apply_seo_strong_tz.php)"

      - name: Activate Avito messenger webhook
        if: inputs.verify_only != true
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key \
            -p "${{ secrets.BEGET_PORT }}" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" \
            "cd '${{ secrets.BEGET_PATH }}' && php8.2 bin/setup_avito_workspace.php && php8.2 bin/setup_avito_webhook.php"

      - name: Inventory API production shadow smoke test
        if: inputs.verify_only != true
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key \
            -p "${{ secrets.BEGET_PORT }}" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" \
            "cd '${{ secrets.BEGET_PATH }}' && php8.2 bin/audit_cron.php && php8.2 bin/sync_inventory_api.php --id=36 --categories=* --mode=shadow --limit=3 --require-api=1 && php8.2 bin/export_inventory_csv.php --mirror-dir=/home/s/shinaspec/its50.ru/public_html/xls/nalichie && php8.2 -d display_errors=stderr -d log_errors=0 bin/diagnose_inventory_mirror.php"
