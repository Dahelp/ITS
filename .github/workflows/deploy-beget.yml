name: Deploy to Beget

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'mobile/**'
      - '.github/workflows/avito-mobile.yml'
  workflow_dispatch:
    inputs:
      stock_fix_only:
        description: Publish only the reviewed free-stock fix with backup and drift checks
        type: boolean
        default: false

      checkout_company_mail_qa:
        description: Send the explicitly authorized organization QA emails to the test mailbox
        type: boolean
        default: false

      checkout_account_only:
        description: Publish only CR-10 checkout account files with backup and drift checks
        type: boolean
        default: false

      checkout_account_maintenance:
        description: Inspect or reset the explicitly authorized CR-10 test mailbox account
        type: choice
        default: none
        options: [none, inspect, reset, suspend, restore]

      verify_only:
        description: Verify protection and SSH without publishing files
        type: boolean
        default: false

      gallery_zoom_only:
        description: Publish PD-01 gallery and zoom with backup and drift checks
        type: boolean
        default: false

      gallery_fix_only:
        description: Publish only gallery fix with backup and drift checks
        type: boolean
        default: false

      checkout_resume_only:
        description: Publish only CR-01 checkout resume files with backup and drift checks
        type: boolean
        default: false

      lead_forms_only:
        description: Publish only the reviewed lead-form manifest with backup and drift checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: its-center-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require current master before accessing server credentials
        run: node .github/scripts/require-current-master.cjs

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/beget_deploy_key
          chmod 600 ~/.ssh/beget_deploy_key
          ssh-keygen -y -f ~/.ssh/beget_deploy_key > /dev/null
          cp .github/production-known-hosts ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  ConnectTimeout 25\n  StrictHostKeyChecking yes\n  IPQoS none\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts

      - name: Check SSH connection
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key \
            -p "${{ secrets.BEGET_PORT }}" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" \
            "test -d '${{ secrets.BEGET_PATH }}' && printf 'Beget SSH read-only check OK\n'"

      - name: Deploy files
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.gallery_fix_only != true && inputs.verify_only != true && inputs.lead_forms_only != true && inputs.checkout_resume_only != true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          rsync -rlgoDzvc --delete \
            -e "ssh -i ~/.ssh/beget_deploy_key -p ${{ secrets.BEGET_PORT }}" \
            --include='vendor/' \
            --include='vendor/ishop/' \
            --include='vendor/ishop/core/***' \
            --exclude='vendor/***' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='mobile/' \
            --exclude='.gitignore' \
            --exclude='.git.corrupt-*' \
            --exclude='.idea/' \
            --exclude='archive/' \
            --exclude='tmp/' \
            --exclude='storage/' \
            --include='public/cron/' \
            --include='public/cron/run_task_cli.php' \
            --exclude='public/cron/***' \
            --exclude='public/xls/' \
            --exclude='public/xml/' \
            --exclude='public/storage/' \
            --exclude='public/uploads/' \
            --exclude='/public/images/***' \
            --filter='protect app/services/HomeCatalog.php' \
            --filter='protect public/css/home.css' \
            --filter='protect public/js/home.js' \
            --filter='protect public/images/home/***' \
            --filter='protect public/images/category/***' \
            --filter='protect public/images/contents/baseimg/***' \
            --filter='protect public/images/complete/baseimg/***' \
            --filter='protect public/images/complete/mini/***' \
            --filter='protect public/images/complete/gallery/***' \
            --filter='protect public/images/contents/mini/***' \
            --filter='protect public/images/contents/tmp/***' \
            --filter='protect public/images/product/original/***' \
            --filter='protect public/images/product/baseimg/***' \
            --filter='protect public/images/product/mini/***' \
            --filter='protect public/images/product/gallery/***' \
            --filter='protect public/images/product/tmp/***' \
            --filter='protect public/images/product/unload/***' \
            --exclude='config/api.php' \
            --exclude='config/config_db.php' \
            --exclude='config/config_db_tamozh.php' \
            --exclude='config/params.php' \
            ./ "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:${{ secrets.BEGET_PATH }}/"

      - name: Install Composer dependencies
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.gallery_fix_only != true && inputs.verify_only != true && inputs.lead_forms_only != true && inputs.checkout_resume_only != true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key \
            -p "${{ secrets.BEGET_PORT }}" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" \
            "cd '${{ secrets.BEGET_PATH }}' && composer-php7.4 install --no-dev --no-interaction --optimize-autoloader"

      - name: Install product certificates
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.gallery_fix_only != true && inputs.verify_only != true && inputs.lead_forms_only != true && inputs.checkout_resume_only != true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd '${{ secrets.BEGET_PATH }}' && (php8.2 scripts/install_certificates.php || php8.1 scripts/install_certificates.php || php7.4 scripts/install_certificates.php || php scripts/install_certificates.php) && (php8.2 scripts/seed_ekka_certificate.php || php8.1 scripts/seed_ekka_certificate.php || php7.4 scripts/seed_ekka_certificate.php || php scripts/seed_ekka_certificate.php)"

      - name: Install order traffic source
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.gallery_fix_only != true && inputs.verify_only != true && inputs.lead_forms_only != true && inputs.checkout_resume_only != true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd '${{ secrets.BEGET_PATH }}' && (php8.2 scripts/add_order_traffic_source.php || php8.1 scripts/add_order_traffic_source.php || php7.4 scripts/add_order_traffic_source.php || php scripts/add_order_traffic_source.php)"

      - name: Install unified cross references
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.gallery_fix_only != true && inputs.verify_only != true && inputs.lead_forms_only != true && inputs.checkout_resume_only != true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd '${{ secrets.BEGET_PATH }}' && (php8.2 scripts/install_unified_crosses.php || php8.1 scripts/install_unified_crosses.php || php7.4 scripts/install_unified_crosses.php || php scripts/install_unified_crosses.php)"

      - name: Seed wheel cross metadata
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.gallery_fix_only != true && inputs.verify_only != true && inputs.lead_forms_only != true && inputs.checkout_resume_only != true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd '${{ secrets.BEGET_PATH }}' && (php8.2 scripts/seed_wheel_cross_metadata.php || php8.1 scripts/seed_wheel_cross_metadata.php || php7.4 scripts/seed_wheel_cross_metadata.php || php scripts/seed_wheel_cross_metadata.php)"

      - name: Add article content
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.gallery_fix_only != true && inputs.verify_only != true && inputs.lead_forms_only != true && inputs.checkout_resume_only != true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key \
            -p "${{ secrets.BEGET_PORT }}" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" \
            "cd '${{ secrets.BEGET_PATH }}' && (php8.2 scripts/add_content_image_source.php || php8.1 scripts/add_content_image_source.php || php7.4 scripts/add_content_image_source.php || php scripts/add_content_image_source.php) && (php8.2 scripts/add_tire_wear_article.php || php8.1 scripts/add_tire_wear_article.php || php7.4 scripts/add_tire_wear_article.php || php scripts/add_tire_wear_article.php) && (php8.2 scripts/add_tire_pressure_monitoring_article.php || php8.1 scripts/add_tire_pressure_monitoring_article.php || php7.4 scripts/add_tire_pressure_monitoring_article.php || php scripts/add_tire_pressure_monitoring_article.php) && (php8.2 scripts/apply_seo_strong_tz.php || php8.1 scripts/apply_seo_strong_tz.php || php7.4 scripts/apply_seo_strong_tz.php || php scripts/apply_seo_strong_tz.php)"

      - name: Activate Avito messenger webhook
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.gallery_fix_only != true && inputs.verify_only != true && inputs.lead_forms_only != true && inputs.checkout_resume_only != true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key \
            -p "${{ secrets.BEGET_PORT }}" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" \
            "cd '${{ secrets.BEGET_PATH }}' && php8.2 bin/setup_avito_workspace.php && php8.2 bin/setup_avito_webhook.php"

      - name: Inventory API production shadow smoke test
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.gallery_fix_only != true && inputs.verify_only != true && inputs.lead_forms_only != true && inputs.checkout_resume_only != true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key \
            -p "${{ secrets.BEGET_PORT }}" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" \
            "cd '${{ secrets.BEGET_PATH }}' && php8.2 bin/audit_cron.php && php8.2 bin/sync_inventory_api.php --id=36 --categories=* --mode=shadow --limit=3 --require-api=1 && php8.2 bin/export_inventory_csv.php --mirror-dir=/home/s/shinaspec/its50.ru/public_html/xls/nalichie && php8.2 -d display_errors=stderr -d log_errors=0 bin/diagnose_inventory_mirror.php"

      - name: Publish bounded lead forms release
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.gallery_fix_only != true && inputs.verify_only != true && inputs.lead_forms_only == true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          php .github/scripts/package-lead-forms.php
          release="lead-forms-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "umask 077; mkdir \"\$HOME/$release\""
          node .github/scripts/require-current-master.cjs
          tar -C /tmp/lead-forms-package -czf /tmp/lead-forms.tar.gz .
          scp -i ~/.ssh/beget_deploy_key -P "${{ secrets.BEGET_PORT }}" /tmp/lead-forms.tar.gz "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:$release/package.tar.gz"
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd \"\$HOME/$release\" && tar -xzf package.tar.gz && php8.2 -d display_errors=stderr -d log_errors=0 install.php '${{ secrets.BEGET_PATH }}'"

      - name: Publish bounded checkout resume release
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.gallery_fix_only != true && inputs.verify_only != true && inputs.checkout_resume_only == true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          php .github/scripts/package-checkout-resume.php
          release="checkout-resume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "umask 077; mkdir \"\$HOME/$release\""
          node .github/scripts/require-current-master.cjs
          tar -C /tmp/checkout-resume-package -czf /tmp/checkout-resume.tar.gz .
          scp -i ~/.ssh/beget_deploy_key -P "${{ secrets.BEGET_PORT }}" /tmp/checkout-resume.tar.gz "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:$release/package.tar.gz"
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd \"\$HOME/$release\" && tar -xzf package.tar.gz && php8.2 -d display_errors=stderr -d log_errors=0 install.php '${{ secrets.BEGET_PATH }}'"

      - name: Publish bounded gallery fix release
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.gallery_zoom_only != true && inputs.verify_only != true && inputs.gallery_fix_only == true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          php .github/scripts/package-gallery-fix.php
          release="gallery-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "umask 077; mkdir \"\$HOME/$release\""
          node .github/scripts/require-current-master.cjs
          tar -C /tmp/gallery-fix-package -czf /tmp/gallery-fix.tar.gz .
          scp -i ~/.ssh/beget_deploy_key -P "${{ secrets.BEGET_PORT }}" /tmp/gallery-fix.tar.gz "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:$release/package.tar.gz"
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd \"\$HOME/$release\" && tar -xzf package.tar.gz && php8.2 -d display_errors=stderr -d log_errors=0 install.php '${{ secrets.BEGET_PATH }}'"

      - name: Publish bounded gallery zoom release
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.checkout_account_only != true && inputs.verify_only != true && inputs.gallery_zoom_only == true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          php .github/scripts/package-gallery-zoom.php
          release="gallery-zoom-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "umask 077; mkdir \"\$HOME/$release\""
          node .github/scripts/require-current-master.cjs
          tar -C /tmp/gallery-zoom-package -czf /tmp/gallery-zoom.tar.gz .
          scp -i ~/.ssh/beget_deploy_key -P "${{ secrets.BEGET_PORT }}" /tmp/gallery-zoom.tar.gz "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:$release/package.tar.gz"
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd \"\$HOME/$release\" && tar -xzf package.tar.gz && php8.2 -d display_errors=stderr -d log_errors=0 install.php '${{ secrets.BEGET_PATH }}'"

      - name: Publish bounded checkout account release
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.verify_only != true && inputs.checkout_account_only == true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          php .github/scripts/package-checkout-account.php
          release="checkout-account-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "umask 077; mkdir '$release'"
          node .github/scripts/require-current-master.cjs
          tar -C /tmp/checkout-account-package -czf /tmp/checkout-account.tar.gz .
          scp -i ~/.ssh/beget_deploy_key -P "${{ secrets.BEGET_PORT }}" /tmp/checkout-account.tar.gz "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:$release/package.tar.gz"
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd '$release' && tar -xzf package.tar.gz && php8.2 -d display_errors=stderr -d log_errors=0 install.php '${{ secrets.BEGET_PATH }}'"
          node .github/scripts/require-current-master.cjs
          mkdir -p /tmp/checkout-account-reports
          scp -i ~/.ssh/beget_deploy_key -P "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:$release/receipt.json" /tmp/checkout-account-reports/
          scp -i ~/.ssh/beget_deploy_key -P "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:$release/smoke.json" /tmp/checkout-account-reports/

      - name: Send authorized checkout company test emails
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.verify_only != true && inputs.checkout_account_only == true && inputs.checkout_company_mail_qa == true)
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          release="checkout-account-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd '$release' && php8.2 -d error_reporting=22527 -d display_errors=stderr -d log_errors=0 company-mail-qa.php '${{ secrets.BEGET_PATH }}' --send"
          node .github/scripts/require-current-master.cjs
          scp -i ~/.ssh/beget_deploy_key -P "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:$release/company-mail-qa.json" /tmp/checkout-account-reports/

      - name: Save checkout account publication receipt
        if: inputs.stock_fix_only != true && (inputs.checkout_account_maintenance != 'suspend' && inputs.checkout_account_maintenance != 'restore' && inputs.checkout_account_maintenance != 'inspect' && inputs.checkout_account_maintenance != 'reset' && inputs.verify_only != true && inputs.checkout_account_only == true)
        uses: actions/upload-artifact@v4
        with:
          name: checkout-account-publication
          path: /tmp/checkout-account-reports/*.json
          retention-days: 30

      - name: Maintain authorized checkout test account
        if: inputs.stock_fix_only != true && (inputs.verify_only != true && (inputs.checkout_account_maintenance == 'inspect' || inputs.checkout_account_maintenance == 'reset' || inputs.checkout_account_maintenance == 'suspend' || inputs.checkout_account_maintenance == 'restore'))
        shell: bash
        env:
          CR10_MODE: ${{ inputs.checkout_account_maintenance }}
        run: |
          set -euo pipefail
          case "$CR10_MODE" in inspect|reset|suspend|restore) ;; *) exit 1 ;; esac
          node .github/scripts/require-current-master.cjs
          release="checkout-account-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "umask 077; mkdir '$release'"
          node .github/scripts/require-current-master.cjs
          scp -i ~/.ssh/beget_deploy_key -P "${{ secrets.BEGET_PORT }}" .github/scripts/checkout-account-maintenance.php "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:$release/maintenance.php"
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "php8.2 -d display_errors=stderr -d log_errors=0 '$release/maintenance.php' '${{ secrets.BEGET_PATH }}' '$CR10_MODE'"

      - name: Publish bounded free stock release
        if: inputs.verify_only != true && inputs.stock_fix_only == true
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/require-current-master.cjs
          php .github/scripts/package-stock-fix.php
          release="stock-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "umask 077; mkdir \"\$HOME/$release\""
          node .github/scripts/require-current-master.cjs
          tar -C /tmp/stock-fix-package -czf /tmp/stock-fix.tar.gz .
          scp -i ~/.ssh/beget_deploy_key -P "${{ secrets.BEGET_PORT }}" /tmp/stock-fix.tar.gz "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:$release/package.tar.gz"
          node .github/scripts/require-current-master.cjs
          ssh -i ~/.ssh/beget_deploy_key -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" "cd \"\$HOME/$release\" && tar -xzf package.tar.gz && php8.2 -d display_errors=stderr -d log_errors=0 install.php '${{ secrets.BEGET_PATH }}'"

          node .github/scripts/require-current-master.cjs
          scp -i ~/.ssh/beget_deploy_key -P "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:$release/receipt.json" /tmp/stock-fix-receipt.json

      - name: Save free stock publication receipt
        if: inputs.verify_only != true && inputs.stock_fix_only == true
        uses: actions/upload-artifact@v4
        with:
          name: stock-fix-publication
          path: /tmp/stock-fix-receipt.json
          retention-days: 30
