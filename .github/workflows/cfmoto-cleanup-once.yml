name: One-time CFMOTO cleanup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REMOVE_CFMOTO_ONCE to run the backed-up cleanup
        required: true
        type: string

jobs:
  cleanup:
    if: ${{ inputs.confirmation == 'REMOVE_CFMOTO_ONCE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.BEGET_SSH_KEY }}" > ~/.ssh/beget_cleanup_key
          chmod 600 ~/.ssh/beget_cleanup_key
          ssh-keyscan -p "${{ secrets.BEGET_PORT }}" "${{ secrets.BEGET_HOST }}" >> ~/.ssh/known_hosts

      - name: Back up affected records, remove retired pages, and rebuild sitemap
        shell: bash
        run: |
          ssh -i ~/.ssh/beget_cleanup_key \
            -p "${{ secrets.BEGET_PORT }}" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}" \
            "cd '${{ secrets.BEGET_PATH }}' && (php8.2 bin/remove_cfmoto.php --apply || php8.1 bin/remove_cfmoto.php --apply || php7.4 bin/remove_cfmoto.php --apply || php bin/remove_cfmoto.php --apply) && (php8.2 public/cron/run_task_cli.php --id=2 || php8.1 public/cron/run_task_cli.php --id=2 || php7.4 public/cron/run_task_cli.php --id=2 || php public/cron/run_task_cli.php --id=2)"
