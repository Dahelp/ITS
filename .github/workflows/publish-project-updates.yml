name: Publish audited project updates
on:
  push:
    branches: [codex/project-publication-20261113]
    paths:
      - '.github/workflows/publish-project-updates.yml'
      - '.github/project-publication/**'
permissions:
  contents: read
concurrency:
  group: its-center-project-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BEGET_HOST: ${{ secrets.BEGET_HOST }}
      BEGET_PORT: ${{ secrets.BEGET_PORT }}
      BEGET_USER: ${{ secrets.BEGET_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure existing SSH access
        env:
          SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          set -euo pipefail
          test "$BEGET_HOST" = 'shinaspec.beget.tech'
          test "$BEGET_USER" = 'shinaspec'
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/project_key
          chmod 600 ~/.ssh/project_key
          cp .github/project-publication/known_hosts ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host project-beget
            HostName $BEGET_HOST
            User $BEGET_USER
            Port $BEGET_PORT
            IdentityFile ~/.ssh/project_key
            BatchMode yes
            StrictHostKeyChecking yes
            IPQoS none
            ConnectTimeout 25
          EOF
          chmod 600 ~/.ssh/config
      - name: Publish reviewed files with private backups and rollback
        run: |
          set -euo pipefail
          remote_dir="/home/s/shinaspec/project-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -C .github/project-publication -czf project-release.tar.gz .
          ssh project-beget "umask 077; mkdir '$remote_dir'"
          scp project-release.tar.gz "project-beget:$remote_dir/release.tar.gz"
          ssh project-beget "tar -xzf '$remote_dir/release.tar.gz' -C '$remote_dir'; /usr/local/bin/php8.2 '$remote_dir/install.php'"
      - name: Retrieve result reports only
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports
          remote_dir="/home/s/shinaspec/project-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for report in receipt.json failure.json smoke.json chains.json stage9/verification.json; do
            if ssh project-beget "test -f '$remote_dir/$report'"; then
              scp "project-beget:$remote_dir/$report" "reports/$(basename "$report")"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-publication-results
          path: reports/*.json
          retention-days: 14
