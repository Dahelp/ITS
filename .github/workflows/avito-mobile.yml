name: Avito mobile checks
on:
  push:
    branches: [master]
    paths: ['mobile/avito_chat/**', '.github/workflows/avito-mobile.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: Build unsigned iOS app on macOS
        type: boolean
        default: false
      ios_firebase:
        description: Include registered iOS Firebase config from repository secret
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/avito_chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: its-avito-android-test
          path: mobile/avito_chat/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: mobile/avito_chat
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure registered Firebase iOS app
        if: inputs.ios_firebase
        env:
          FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
        run: |
          test -n "$FIREBASE_IOS_PLIST_BASE64" || { echo 'Missing FIREBASE_IOS_PLIST_BASE64 secret'; exit 1; }
          printf '%s' "$FIREBASE_IOS_PLIST_BASE64" | base64 --decode > "$RUNNER_TEMP/GoogleService-Info.plist"
          python3 tool/configure_ios_firebase.py "$RUNNER_TEMP/GoogleService-Info.plist"
      - name: Build unsigned iPhone app
        run: |
          if [ "${{ inputs.ios_firebase }}" = "true" ]; then
            flutter build ios --release --no-codesign --dart-define-from-file=firebase.local.json
          else
            flutter build ios --release --no-codesign
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: its-avito-ios-unsigned
          path: mobile/avito_chat/build/ios/iphoneos/Runner.app
          retention-days: 7
