name: Avito mobile checks
on:
  push:
    branches: [master]
    paths: ['mobile/avito_chat/**', '.github/workflows/avito-mobile.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: Build unsigned iOS app on macOS
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/avito_chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: its-avito-android-test
          path: mobile/avito_chat/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        working-directory: mobile/avito_chat
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: its-avito-ios-unsigned
          path: mobile/avito_chat/build/ios/iphoneos/Runner.app
          retention-days: 7
